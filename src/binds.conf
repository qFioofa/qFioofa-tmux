##
# Binds
##

######
# Rebind prefix
# Ctrl + m (primary) || Alt + n (secondary)
# NOTE: C-m == Enter at the byte level; needs a terminal with
# extended-keys (CSI-u) support to tell them apart. M-n is the safe fallback.
set-option -g prefix C-m
set-option -g prefix2 M-n
bind-key C-m send-prefix

###
# Windows
######

# Select (vim motions)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix-free pane navigation (Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize (-r = repeatable without re-pressing prefix)
bind -r < resize-pane -L 10
bind -r > resize-pane -R 10
bind -r _ resize-pane -D 10
bind -r + resize-pane -U 10

# Copy-mode (vi): v to select, y to yank, r for rectangle toggle
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi r send-keys -X rectangle-toggle

##
# Create panel
##

unbind c
unbind C
bind c command-prompt -p "\
#{@command-prefix}\
Window name: " \
"new-window -c '#{pane_current_path}' -n %%"

bind C new-window -c "#{pane_current_path}"

unbind '"'
bind '"' split-window -c "#{pane_current_path}"

unbind %
bind % split-window -h -c "#{pane_current_path}"

# Rebind ro reload config
unbind r
bind r source-file '~/.config/tmux/tmux.conf' \; display ".tmux.conf Reloaded!"

##
# Sessions
##

# Create new (auto number)
# Prefix + N (New)
unbind N
bind N new-session

# Choose session (interactive)
# Prefix + e (Session)
bind e choose-tree -Z

# Kill session
# Prefix + W (Kill Session)
bind W confirm-before -p "Kill session #S? (y/n)" kill-session

##
# Russian layout (ЙЦУКЕН) mirrors
# Bare keys after the prefix / in copy-mode send Cyrillic when the RU
# layout is active, so the Latin binds above never fire. These duplicate
# them by physical key position. Ctrl/Alt combos (prefix C-m, M-n) and the
# keys that produce the same char on RU (resize _ +, split %) aren't mirrored.
##

# Pane select (h j k l -> р о л д)
bind р select-pane -L
bind о select-pane -D
bind л select-pane -U
bind д select-pane -R

# Resize (< > -> Б Ю; _ + share the physical key, so no mirror)
bind -r Б resize-pane -L 10
bind -r Ю resize-pane -R 10

# Prefix-free pane navigation (M-h/j/k/l -> M-р/о/л/д)
bind -n M-р select-pane -L
bind -n M-о select-pane -D
bind -n M-л select-pane -U
bind -n M-д select-pane -R

# Copy-mode vi (v y r -> м н к)
bind -T copy-mode-vi м send-keys -X begin-selection
bind -T copy-mode-vi н send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi к send-keys -X rectangle-toggle

# Create panel (c C -> с С; " -> Э for the vertical split, % shares its key)
bind с command-prompt -p "#{@command-prefix}Window name: " "new-window -c '#{pane_current_path}' -n %%"
bind С new-window -c "#{pane_current_path}"
bind Э split-window -c "#{pane_current_path}"

# Reload config (r -> к)
bind к source-file '~/.config/tmux/tmux.conf' \; display ".tmux.conf Reloaded!"

# Sessions (N e W -> Т у Ц)
bind Т new-session
bind у choose-tree -Z
bind Ц confirm-before -p "Kill session #S? (y/n)" kill-session
