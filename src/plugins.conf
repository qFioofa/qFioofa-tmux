##
# Plugins
##

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# navigation / config
set -g @plugin 'christoomey/vim-tmux-navigator'   # C-h/j/k/l across vim + tmux
set -g @plugin 'b0o/tmux-autoreload'              # auto-reload config on save (needs entr/inotifywait)
set -g @plugin 'MunifTanjim/tmux-mode-indicator'  # COPY/SYNC/PREFIX indicator for the bar

# text / copy
set -g @plugin 'laktak/extrakto'                  # fuzzy-extract tokens from the pane (fzf)
set -g @plugin 'roosta/tmux-fuzzback'             # fuzzy-search the scrollback
set -g @plugin 'tmux-plugins/tmux-open'           # open path/url under cursor in copy-mode

# session / window UX
set -g @plugin 'ofirgall/tmux-window-name'        # auto-name windows by running program (needs python3)
set -g @plugin 'tmux-plugins/tmux-sidebar'        # prefix+Tab directory tree
set -g @plugin 'tmux-plugins/tmux-logging'        # capture pane / save screen
set -g @plugin 'sainnhe/tmux-fzf'                 # fzf menu over sessions/windows/panes/keys

# resurrect / continuum: save & auto-restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# interactive plugin triggers (prefix + key)
set -g @sessionx-bind 'o'
set -g @floax-bind 'p'
set -g @thumbs-key 'F'
set -g @fzf-url-bind 'u'
set -g @extrakto_key 'x'        # prefix+Tab is taken by sidebar
set -g @fuzzback-bind 's'
set -g @tmux-fzf-launch-key 'g' # default 'F' collides with thumbs

# mode-indicator styling (themed)
set -g @mode_indicator_empty_prompt ' tmux '
set -g @mode_indicator_empty_mode_style 'bg=#{@thm_color500},fg=#{@thm_color100}'
set -g @mode_indicator_prefix_prompt ' PREFIX '
set -g @mode_indicator_prefix_mode_style 'bg=#{@thm_gold},fg=#{@thm_color700}'
set -g @mode_indicator_copy_prompt ' COPY '
set -g @mode_indicator_copy_mode_style 'bg=#{@thm_success},fg=#{@thm_color700}'
set -g @mode_indicator_sync_prompt ' SYNC '
set -g @mode_indicator_sync_mode_style 'bg=#{@thm_error},fg=#{@thm_color700}'

# tmux-open: open in $EDITOR / browser from copy-mode (o = open, C-o = edit)
set -g @open-editor 'C-o'

# window-name: keep tmux from re-renaming what programs set
set -g @tmux_window_name_use_tilde 'True'

# sidebar: nicer tree if available
set -g @sidebar-tree-command 'tree -C'

run '${HOME}/.tmux/plugins/tpm/tpm' # Must be at the end of the line
